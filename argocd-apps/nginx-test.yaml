apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-test
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ravi-vignesh-vel/enterprise-gitops.git
    targetRevision: main
    path: helm/nginx-demo
    helm:
      valueFiles:
        - ../../environments/test/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
